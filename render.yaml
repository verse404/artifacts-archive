services:
  - type: web
    name: artifacts-archive
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://thumb.wikimedia.org https://upload.wikimedia.org https://images.metmuseum.org https://collections.louvre.fr https://www.hermitagemuseum.org; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /css/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /js/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /img/atlases/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
